<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 24" width="900" height="24" role="presentation">
  <defs>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#58a6ff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#bc8cff" stop-opacity="1"/>
      <stop offset="100%" stop-color="#ff7b72" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#58a6ff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <line x1="0" y1="12" x2="900" y2="12" stroke="url(#line)" stroke-width="2"/>
  <line x1="0" y1="12" x2="900" y2="12" stroke="#0d1117" stroke-width="2" stroke-dasharray="3 11">
    <animate attributeName="stroke-dashoffset" from="0" to="-28" dur="1.4s" repeatCount="indefinite"/>
  </line>
  <circle cy="12" r="9" fill="url(#glow)">
    <animate attributeName="cx" values="0;900" dur="5s" repeatCount="indefinite"/>
  </circle>
</svg>
